name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skills and profiles
        run: python scripts/validate_skills.py
      - name: Install smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install.ps1 -Destination (Join-Path $env:RUNNER_TEMP "china-k12-skills")
      - name: Install smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/install.sh "$RUNNER_TEMP/china-k12-skills"
